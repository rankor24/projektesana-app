appId: lv.buvdizains.projektesana
productName: Projektesana
directories:
  output: release
files:
  - dist/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: data
    to: data
  - from: resources/tessdata
    to: tessdata
  - from: resources/bimcraft
    to: bimcraft
  - from: resources/skills
    to: skills
  - from: resources/office-text.ps1
    to: office-text.ps1
asarUnpack:
  - dist/agent/tools/**
win:
  target:
    - nsis
# Setup: per-user install (no admin), Boris picks the folder; the app data in %APPDATA%\Projektesana stays on uninstall.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Projektēšana
  deleteAppDataOnUninstall: false
  artifactName: Projektesana-Setup-${version}.${ext}
