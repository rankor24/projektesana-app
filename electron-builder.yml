appId: lv.buvdizains.projektesana
productName: Projektesana
directories:
  output: release
# Electron runtime from the installed npm package (version pinned in package.json, checked by npm install), so
# packaging is offline and never fetches the runtime or its checksum list from GitHub.
electronDist: node_modules/electron/dist
files:
  - dist/**
  - package.json
  - "!**/*.map"
  # transformers.js (the search index's embedding model) runs on onnxruntime-node: only the Windows x64 binary is needed, and its
  # browser build (onnxruntime-web) is already inside transformers.js's own bundle. The model files are not here: they are downloaded
  # into the app data folder on first use.
  - "!node_modules/onnxruntime-web/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
extraResources:
  - from: data
    to: data
  - from: resources/tessdata
    to: tessdata
  - from: resources/bimcraft
    to: bimcraft
  - from: resources/cadcraft
    to: cadcraft
  - from: resources/skills
    to: skills
  - from: resources/revit-mcp
    to: revit-mcp
  - from: resources/office-text.ps1
    to: office-text.ps1
  - from: resources/office-word.ps1
    to: office-word.ps1
asarUnpack:
  - dist/agent/tools/**
  # claude.exe of the Claude Agent SDK (Claude subscription engine): an exe inside the asar cannot be started
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # onnxruntime.dll and its binding: a native library cannot be loaded from inside the asar
  - node_modules/onnxruntime-node/**
  - node_modules/@img/**
win:
  target:
    - nsis
# Setup: per-user install (no admin), the user picks the folder; the app data in %APPDATA%\Projektesana stays on uninstall.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Projektēšana
  deleteAppDataOnUninstall: false
  artifactName: Projektesana-Setup-${version}.${ext}
